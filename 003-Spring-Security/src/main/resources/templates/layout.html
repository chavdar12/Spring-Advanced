<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="nav">
    <a th:href="@{/}">Home</a>
    <a sec:authorize="isAnonymous()" th:href="@{/login}">Login</a>
    <a sec:authorize="isAnonymous()" th:href="@{/register}">Register</a>
    <a sec:authorize="isAuthenticated()" th:href="@{/profile}">Profile</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}">Users</a>
    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" style="display: inline">
        <button>Logout</button>
    </form>
</nav>
</body>
</html>
