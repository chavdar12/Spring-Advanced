name: Build

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 001-Web-API-And-REST-Controllers
          - 002-Exercise-Web-API-And-REST-Controllers
          - 003-Spring-Security
          - 004-HATEOAS
          - 005-Error-Handling
          - 006-Events
          - 007-AOP
          - 008-Unit-And-Integration-Testing
          - 009-Containerization-And-Documentation
          - 010-Deployment-Hosting-And-Monitoring
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.project }}
          path: ${{ matrix.project }}/build/reports/tests/
